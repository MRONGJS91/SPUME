# MetaShift Cat-vs-Dog SPUME full run with cleaned ViT-GPT2 concepts
#
# Embedding files built by: scripts/metashift/build_spume_vitgpt2_embeddings.py

dataset: metashift_catdog
data_folder: D:\SPUME\datasets\metashift
metadata_path: D:\SPUME\datasets\metashift\metadata_metashift_catdog.csv
backbone: resnet50
pretrained: true
n_classes: 2
batch_size: 8
num_supp: 10
num_query: 10
num_epochs: 50
num_episode: 80
task_num: 1
topk: 10
vlm: vit-gpt2
score_func: tanh-abs-log
scheduler: cosine
alpha: 1.0
lr: 1.e-3
augmentation: true
temp: 5.0
use_val: true
use_group_label: false
random_sampler: false
fast_train: false
test: false
amp: true
use_checkpoint: true
meta_chunk_size: 2
val_threshold_num: 100
num_workers: 4
seed: 100
n_gpu: 1
tag: metashift_catdog_vitgpt2_cleaned_spume_full
save_folder: D:\SPUME\how_to_run\meta_spurious_exprs

# --- cleaned ViT-GPT2 concept embeddings ---
vit_gpt2_attr_embed_path: D:\SPUME\datasets\metashift\vitgpt2_cleaned_img_embeddings.pickle
vit_gpt2_vocab_path: D:\SPUME\datasets\metashift\vitgpt2_cleaned_vocab.pickle
blip_attr_embed_path: D:\SPUME\datasets\metashift\vitgpt2_cleaned_img_embeddings.pickle
blip_vocab_path: D:\SPUME\datasets\metashift\vitgpt2_cleaned_vocab.pickle
