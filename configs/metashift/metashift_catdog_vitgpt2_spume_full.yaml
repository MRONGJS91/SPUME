# MetaShift Cat-vs-Dog  SPUME full run with ViT-GPT2
#
# Prerequisites:
#   1. Run extract_concepts.py with --dataset metashift_catdog --model vit-gpt2
#   2. Update vit_gpt2_attr_embed_path / vit_gpt2_vocab_path below
#
# Usage:
#   python train_meta_spurious.py --config configs/metashift/metashift_catdog_vitgpt2_spume_full.yaml

dataset: metashift_catdog
data_folder: D:\SPUME\datasets\metashift
metadata_path: D:\SPUME\datasets\metashift\metadata_catdog.csv
backbone: resnet50
pretrained: true
n_classes: 2
batch_size: 8
num_supp: 10
num_query: 10
num_epochs: 100
num_episode: 80
task_num: 1
topk: 10
vlm: vit-gpt2
score_func: tanh-abs-log
scheduler: cosine
alpha: 1.0
lr: 1.e-3
augmentation: true
temp: 5.0
use_val: true
use_group_label: false
random_sampler: false
fast_train: false
test: false
amp: true
use_checkpoint: true
meta_chunk_size: 2
val_threshold_num: 100
num_workers: 4
seed: 100
n_gpu: 1
tag: metashift_catdog_vitgpt2_spume_full
save_folder: D:\SPUME\how_to_run\meta_spurious_exprs

# --- concept embedding paths (update after extraction) ---
vit_gpt2_attr_embed_path: D:\SPUME\datasets\metashift\vit_gpt2_img_embeddings.pickle
vit_gpt2_vocab_path: D:\SPUME\datasets\metashift\vit_gpt2_vocab.pickle
blip_attr_embed_path: D:\SPUME\datasets\metashift\blip_img_embeddings.pickle
blip_vocab_path: D:\SPUME\datasets\metashift\blip_vocab.pickle
